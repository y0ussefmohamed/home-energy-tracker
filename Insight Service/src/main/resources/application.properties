spring.application.name=Insight-Service
server.port=8085

# Actuator & Prometheus (scraped by the monitoring container)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

usage.service.url=http://localhost:8083/api/v1/usage

# Ollama / Spring AI
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:1.5b
spring.ai.ollama.chat.temperature=0.2
spring.ai.ollama.chat.num-predict=256
spring.ai.ollama.init.pull-model-strategy=never
